name: Bootstrap demo label

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-label.yml
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  ensure-label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure codebuddy-approved label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh label create codebuddy-approved
          --repo "$GITHUB_REPOSITORY"
          --color "0E8A16"
          --description "Approved for CodeBuddy automation"
          --force
      - name: Apply label to the demo issue
        if: github.event_name == 'issues' && github.event.issue.title == 'Add task due dates and overdue status'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label codebuddy-approved
